name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "Triggered by tag push (${{ github.ref_name }}), proceeding with release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $VERSION detected without existing tag $TAG. Triggering release!"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and publish binaries
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            ext: ""
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --locked --bins --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          PREFIX="svgfetch-$TARGET"
          ARTIFACT="svgfetch-$TARGET.$ARCHIVE"
          mkdir -p "dist/$PREFIX"
          cp "target/$TARGET/release/svgfetch$EXT" "dist/$PREFIX/"
          cp "target/$TARGET/release/svgfetch$EXT" "dist/$PREFIX/svg-fetch$EXT"
          cp "target/$TARGET/release/svgfetch$EXT" "dist/$PREFIX/get-svg$EXT"
          cp "target/$TARGET/release/svgfetch$EXT" "dist/$PREFIX/getsvg$EXT"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$PREFIX/"
          cd dist
          if [ "$ARCHIVE" = "zip" ]; then
            7z a "$ARTIFACT" "$PREFIX"
          else
            tar -czf "$ARTIFACT" "$PREFIX"
          fi

      - name: Upload binary checksum
        shell: bash
        env:
          ARTIFACT: svgfetch-${{ matrix.target }}.${{ matrix.archive }}
        run: |
          set -euo pipefail
          cd dist
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$ARTIFACT" > "$ARTIFACT.sha256"
          elif command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          else
            openssl dgst -sha256 "$ARTIFACT" | awk '{print $2}' > "$ARTIFACT.sha256"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: ${{ needs.check-version.outputs.tag }}
          files: |
            dist/svgfetch-${{ matrix.target }}.${{ matrix.archive }}
            dist/svgfetch-${{ matrix.target }}.${{ matrix.archive }}.sha256
          generate_release_notes: true

  publish-npm:
    name: Publish to npm
    needs: [check-version, release]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish to npm
        run: |
          cd npm
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}